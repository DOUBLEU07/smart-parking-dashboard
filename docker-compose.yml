# Internet → Nginx → FastAPI → PostgreSQL
#
# Two-tier network (public tier / private tier). The private tier is split in
# two segments so even Nginx cannot reach the database (least privilege):
#
#   public_subnet       172.28.1.0/24  Nginx: serves the web app; the ONLY published port
#   private_app_subnet  172.28.2.0/24  Nginx <-> FastAPI REST API (internal, no Internet route)
#   private_db_subnet   172.28.3.0/24  FastAPI <-> PostgreSQL (internal, no published port)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      private_db_subnet:
        ipv4_address: 172.28.3.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parking}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      INITIAL_OWNER_USERNAME: ${INITIAL_OWNER_USERNAME:-owner}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:?set INITIAL_OWNER_PASSWORD in .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      DEMO_MODE: ${DEMO_MODE:-true}
      TIMEZONE: Asia/Bangkok
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      private_app_subnet:
        ipv4_address: 172.28.2.20
      private_db_subnet:
        ipv4_address: 172.28.3.20

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      public_subnet:
        ipv4_address: 172.28.1.30
      private_app_subnet:
        ipv4_address: 172.28.2.30

networks:
  public_subnet:
    ipam:
      config: [{ subnet: 172.28.1.0/24 }]
  private_app_subnet:
    internal: true
    ipam:
      config: [{ subnet: 172.28.2.0/24 }]
  private_db_subnet:
    internal: true
    ipam:
      config: [{ subnet: 172.28.3.0/24 }]

volumes:
  pgdata: {}
